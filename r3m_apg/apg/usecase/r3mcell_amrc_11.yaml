# R3M Project - Initial Conditions for the R3M Cell Environment Launch:

# Use-Case Information:
Information:
  UseCase: "R3M Cell (AMRC): Cube Stacking Use-Case."
  Name: "r3mcell_amrc_11"

# Robot Information:
Robot:
  Model: "irb1200"
  Link: "EE_gpp5010nc"
  EEType: "ParallelGripper"
  Package: "r3mcell_amrc_gazebo"
  HomePose:
    x: 0.451
    y: 0.0
    z: 0.774
    qx: 0.707
    qy: 0.0
    qz: 0.707
    qw: 0.0

# Object List:
ObjectList:
  - Name: "BottomCube"
    Link: "BottomCube"
    CADFile: "BottomCube"
    Package: "r3mcell_cu_gazebo"
    InitialPose: 
      x: "{'min': 0.25, 'max': 0.75}"
      y: "{'min': -0.25, 'max': 0.25}"
      z: 0.15
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 0.0
    CurrentPose: None
    PreviousPose: None
  - Name: "TopCube"
    Link: "TopCube"
    CADFile: "TopCube"
    Package: "r3mcell_cu_gazebo"
    InitialPose:   
      x: "{'min': 0.25, 'max': 0.75}"
      y: "{'min': -0.25, 'max': 0.25}"
      z: 0.15
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 0.0
    CurrentPose: None
    PreviousPose: None

# Liaison:
Liaison:
  - Name: "Bottom Cube is placed on the desired position on top of the workspace."
    Parent: "GLOBAL"
    Child: "BottomCube"
    Transform:
      diffMax: 0.01
      position: True
      orientation: False
      x: 0.25
      y: -0.40
      z: 0.139
  - Name: "Top Cube is placed inside the Bottom Cube."
    Parent: "BottomCube"
    Child: "TopCube"
    Transform:
      diffMax: 0.01
      position: True
      orientation: False
      x: 0.0
      y: 0.0
      z: 0.01