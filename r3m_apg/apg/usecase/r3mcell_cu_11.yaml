# R3M Project - Initial Conditions for the R3M Cell Environment Launch:

# Use-Case Information:
Information:
  UseCase: "R3M Cell (Cranfield University): Cube Stacking Use-Case."
  Name: "CubeStacking"

# Robot Information:
Robot:
  Model: "irb120"
  Link: "EE_egp64"
  EEType: "ParallelGripper"
  Package: "r3mcell_cu_gazebo"
  HomePose:
    x: 0.577
    y: 0.525
    z: 1.228
    qx: 0.0
    qy: 1.0
    qz: 0.0
    qw: 0.0

# Object List:
ObjectList:
  - Name: "BottomCube"
    Link: "BottomCube"
    CADFile: "BottomCube"
    Package: "r3mcell_cu_gazebo"
    InitialPose: 
      x: "{'min': 0.45, 'max': 0.70}"
      y: "{'min': 0.10, 'max': 0.95}"
      z: 0.89
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 0.0
    CurrentPose: None
    PreviousPose: None
  - Name: "TopCube"
    Link: "TopCube"
    CADFile: "TopCube"
    Package: "r3mcell_cu_gazebo"
    InitialPose:   
      x: "{'min': 0.4, 'max': 0.75}"
      y: "{'min': 0.0, 'max': 0.8}"
      z: 0.88
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 0.0
    CurrentPose: None
    PreviousPose: None

# Liaison:
Liaison:
  - Name: "Bottom Cube is placed on the desired position on top of the workspace."
    Parent: "GLOBAL"
    Child: "BottomCube"
    Transform:
      diffMax: 0.01
      position: True
      orientation: False
      x: 0.225
      y: 0.875
      z: 0.88
  - Name: "Top Cube is placed inside the Bottom Cube."
    Parent: "BottomCube"
    Child: "TopCube"
    Transform:
      diffMax: 0.01
      position: True
      orientation: False
      x: 0.0
      y: 0.0
      z: 0.005