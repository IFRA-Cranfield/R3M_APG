# Object List:
ObjectList:
  - Name: "BottomCube"
    Link: "BottomCube"
    CADFile: "BottomCube"
    Package: "r3mcell_cu_gazebo"
    InitialPose: 
      x: "{'min': -0.25, 'max': 0.25}"
      y: "{'min': 0.23, 'max': 0.35}"
      z: 0.89
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 0.0
    CurrentPose: None
    PreviousPose: None
  - Name: "TopCube"
    Link: "TopCube"
    CADFile: "TopCube"
    Package: "r3mcell_cu_gazebo"
    InitialPose:   
      x: "{'min': -0.25, 'max': 0.25}"
      y: "{'min': 0.23, 'max': 0.35}"
      z: 0.88
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 0.0
    CurrentPose: None
    PreviousPose: None

# Liaison:
Liaison:
  - Name: "Bottom Cube is placed on the desired position on top of the workspace."
    Parent: "GLOBAL"
    Child: "BottomCube"
    Transform:
      diffMax: 0.01
      position: True
      orientation: False
      x: 0.25
      y: 0.36
      z: 0.865
  - Name: "Top Cube is placed inside the Bottom Cube."
    Parent: "BottomCube"
    Child: "TopCube"
    Transform:
      diffMax: 0.01
      position: True
      orientation: False
      x: 0.0
      y: 0.0
      z: 0.01