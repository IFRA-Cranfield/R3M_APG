# Object List:
ObjectList:
  - Name: "BaseCylinder"
    Link: "BaseCylinder"
    CADFile: "BaseCylinder"
    Package: "r3mcell_amrc"
    InitialPose: 
      x: "{'min': -0.35, 'max': 0.35}"
      y: "{'min': 1.65, 'max': 2.35}"
      z: 0.165
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 0.0
    CurrentPose: None
    PreviousPose: None
  - Name: "TopCylinder"
    Link: "TopCylinder"
    CADFile: "TopCylinder"
    Package: "r3mcell_amrc"
    InitialPose:   
      x: "{'min': -0.35, 'max': 0.35}"
      y: "{'min': 1.65, 'max': 2.35}"
      z: 0.14
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 0.0
    CurrentPose: None
    PreviousPose: None

# Liaison:
Liaison:
  - Name: "Base Cylinder is placed on top of the fixture."
    Parent: "GLOBAL"
    Child: "BaseCylinder"
    Transform:
      diffMax: 0.03
      position: True
      orientation: False
      x: 0.0
      y: 2.0
      z: 0.165
  - Name: "Top Cylinder is placed on top of the Base Cylinder."
    Parent: "GLOBAL"
    Child: "TopCylinder"
    Transform:
      diffMax: 0.05
      position: True
      orientation: False
      x: 0.0
      y: 2.0
      z: 0.169