    Parent: "GLOBAL"
    Child: "BaseCylinder"
    Transform:
      diffMax: 0.01
      position: True
      orientation: False
      x: 0.45
      y: 1.00
      z: 0.89
  - Name: "Top Cylinder is placed on top of the Base Cylinder."
    Parent: "BaseCylinder"
    Child: "TopCylinder"
    Transform:
      diffMax: 0.01
      position: True
      orientation: False
      x: 0.0
      y: 0.0
      z: 0.035